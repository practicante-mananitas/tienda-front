<h2>Editar Producto</h2>

<form (ngSubmit)="onSubmit()" enctype="multipart/form-data" #form="ngForm">
  <div class="form-group">
    <label>Nombre:</label>
    <input type="text" [(ngModel)]="product.name" name="name" required>
  </div>

  <div class="form-group">
    <label>Descripción:</label>
    <textarea [(ngModel)]="product.description" name="description"></textarea>
  </div>

  <div class="form-group">
    <label>Precio:</label>
    <input type="number" [(ngModel)]="product.price" name="price" required>
  </div>

  <!-- NUEVO: Campo para editar el Stock -->
  <div class="form-group">
    <label>Stock:</label>
    <input type="number" [(ngModel)]="product.stock" name="stock" required min="0">
  </div>

  <div class="form-group">
    <label>Categoría:</label>
    <select name="category_id" required (change)="onCategoryChange($event)">
      <option value="" disabled>Selecciona una categoría</option>
      <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
    </select>
  </div>

  <div class="form-group">
    <label>Subcategoría:</label>
    <select [(ngModel)]="product.subcategory_id" name="subcategory_id" required>
      <option value="" disabled>Selecciona una subcategoría</option>
      <option *ngFor="let sub of subcategories" [value]="sub.id">{{ sub.name }}</option>
    </select>
  </div>


  <fieldset>
    <legend>Medidas (cm / kg)</legend>

    <div class="form-group">
      <label>Peso:</label>
      <input type="number" step="0.01" [(ngModel)]="product.weight" name="weight">
    </div>
    <div class="form-group">
      <label>Alto:</label>
      <input type="number" step="0.1" [(ngModel)]="product.height" name="height">
    </div>
    <div class="form-group">
      <label>Ancho:</label>
      <input type="number" step="0.1" [(ngModel)]="product.width" name="width">
    </div>
    <div class="form-group">
      <label>Largo:</label>
      <input type="number" step="0.1" [(ngModel)]="product.length" name="length">
    </div>

    <div *ngIf="pesoVolumetrico > 0" class="peso-volumetrico-box">
      <p><strong>Peso volumétrico estimado:</strong> {{ pesoVolumetrico }} kg</p>
      <p class="peso-volumetrico-hint">
        Se usará este valor si es mayor al peso real. Intenta optimizar las medidas.
      </p>

      <div *ngIf="pesoFacturable > 0" class="peso-facturable-box">
        <p><strong>Peso facturable estimado:</strong> {{ pesoFacturable }} kg</p>
        <p class="peso-volumetrico-hint">
          Este valor se usa como base para la cotización.
        </p>
      </div>
    </div>
  </fieldset>

  <div class="form-group">
    <label>Imagen actual:</label><br>
    <img *ngIf="product.image" [src]="'http://127.0.0.1:8000/storage/' + product.image" width="100">
  </div>

  <div class="form-group">
    <label>Galería actual:</label>
    <div class="gallery-preview">
      <div *ngFor="let img of gallery" class="thumb">
        <img [src]="'http://127.0.0.1:8000/storage/' + img.image" alt="Galería" width="100">
        <button type="button" class="delete-button" (click)="eliminarImagenGaleria(img.id)">❌</button>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>Nueva imagen (opcional):</label>
    <input type="file" (change)="onFileChange($event)">
  </div>

  <div class="form-group">
    <label>Agregar nuevas imágenes a la galería:</label>
    <input type="file" (change)="onGalleryChange($event)" multiple>
  </div>

  <button type="submit">Actualizar</button>
</form>
