<div class="back-btn-container">
  <button class="back-btn" (click)="volver()">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
      <path d="M15 18l-6-6 6-6" />
    </svg>
    Volver
  </button>
</div>

<form *ngIf="!mostrarExtraInfo && !soloExtra" (ngSubmit)="onSubmit()" #form="ngForm">
  <h2>{{ modoEdicion ? 'Editar Dirección' : 'Nueva Dirección' }}</h2>

  <label>
    Calle:
    <input type="text" name="calle" [(ngModel)]="direccion.calle" placeholder="Ej: Avenida Reforma 123" required>
  </label>

  <label>
    Estado:
    <select name="state" [(ngModel)]="direccion.estado" (change)="onEstadoChange($event)" required>
      <option *ngFor="let estado of estados" [value]="estado.id">{{ estado.name }}</option>
    </select>
  </label>

  <label>
    Municipio:
    <input type="text" name="municipio" [(ngModel)]="direccion.municipio" (input)="filtrarMunicipios()" autocomplete="off" required>
    <ul *ngIf="sugerenciasMunicipios.length > 0" class="sugerencias">
      <li *ngFor="let sugerencia of sugerenciasMunicipios" (click)="seleccionarMunicipio(sugerencia)">{{ sugerencia }}</li>
    </ul>
  </label>

  <label>
    Código Postal:
    <input type="text" name="codigo_postal" [(ngModel)]="direccion.codigo_postal" (input)="filtrarCPs()" autocomplete="off" required>
    <ul *ngIf="sugerenciasCP.length > 0" class="sugerencias">
      <li *ngFor="let sugerencia of sugerenciasCP" (click)="seleccionarCP(sugerencia)">{{ sugerencia }}</li>
    </ul>
  </label>

  <label>
    Localidad:
    <input type="text" name="localidad" [(ngModel)]="direccion.localidad" (input)="filtrarLocalidades()" autocomplete="off" required>
    <ul *ngIf="sugerenciasLocalidades.length > 0" class="sugerencias">
      <li *ngFor="let sugerencia of sugerenciasLocalidades" (click)="seleccionarLocalidad(sugerencia)">{{ sugerencia }}</li>
    </ul>
  </label>

  <label>
    Colonia / Barrio:
    <input type="text" name="colonia" [(ngModel)]="direccion.colonia" (input)="filtrarColonias()" autocomplete="off" required>
    <ul *ngIf="sugerenciasColonias.length > 0" class="sugerencias">
      <li *ngFor="let sugerencia of sugerenciasColonias" (click)="seleccionarColonia(sugerencia)">{{ sugerencia }}</li>
    </ul>
  </label>

  <label>
    Número interior / Depto (opcional):
    <input type="text" name="numero_interior" [(ngModel)]="direccion.numero_interior">
  </label>

  <label>
    Indicaciones para entrega (opcional):
    <textarea name="indicaciones_entrega" [(ngModel)]="direccion.indicaciones_entrega"></textarea>
  </label>

  <label>
    Tipo de domicilio:
    <select name="tipo_domicilio" [(ngModel)]="direccion.tipo_domicilio" required>
      <option value="" disabled selected>Selecciona un tipo</option>
      <option value="residencial">Residencial</option>
      <option value="laboral">Laboral</option>
    </select>
  </label>

  <button type="submit">{{ modoEdicion ? 'Actualizar Dirección' : 'Guardar Dirección' }}</button>
</form>


<!-- Resumen de dirección -->
<div *ngIf="mostrarExtraInfo" class="card-resumen">
  <div class="resumen-header">
    <span class="icon">📍</span>
    <div>
      <strong>Tu domicilio</strong>
      {{ direccion.calle }}<br>
      {{ direccion.tipo_domicilio === 'residencial' ? 'Residencial' : 'Laboral' }}
    </div>
  </div>
</div>

<!-- SECCIÓN EXTRA INFO -->
<div  *ngIf="mostrarExtraInfo || soloExtra" class="seccion-extra">
  

  <div class="card-direccion">
    <h3>Completa datos del lugar para agilizar tus envíos</h3>
    <div class="tipo-container">
      <button 
        *ngFor="let tipo of tiposLugar" 
        (click)="tipoLugar = tipo.valor"
        [ngClass]="{ 'selected': tipoLugar === tipo.valor }">
        <div class="icono">{{ tipo.icono }}</div>
        <div>{{ tipo.label }}</div>
      </button>
    </div>
    <!-- Si es abarrotes u otro -->
<div *ngIf="tipoLugar === 'tienda' || tipoLugar === 'otro'" class="grupo-form">

  <label class="pregunta">¿En dónde está ubicado?</label>
  <div class="radio-group">
    <label>
      <input type="radio" [(ngModel)]="extraInfo.ubicacionTipo" value="centro" name="ubicacionTipo">
      Centro comercial
    </label>
    <label>
      <input type="radio" [(ngModel)]="extraInfo.ubicacionTipo" value="barrio" name="ubicacionTipo">
      Barrio privado
    </label>
    <label>
      <input type="radio" [(ngModel)]="extraInfo.ubicacionTipo" value="ninguna" name="ubicacionTipo">
      Ninguna de las anteriores
    </label>
  </div>

  <label class="pregunta">
    {{
      extraInfo.ubicacionTipo === 'centro' ? 'Nombre del centro comercial' :
      extraInfo.ubicacionTipo === 'barrio' ? 'Nombre de la vivienda' :
      extraInfo.ubicacionTipo === 'ninguna' ? 'Nombre de la tienda' :
      ''
    }}
  </label>

  <div class="nombre-casa-input">
  <input
    type="text"
    [(ngModel)]="extraInfo.nombre_casa"
    name="nombre_casa"
    placeholder="{{ extraInfo.ubicacionTipo === 'centro' ? 'Ej: Plaza Las Américas' :
                   extraInfo.ubicacionTipo === 'barrio' ? 'Ej: Condominio Arcos del Sol' :
                   'Ej: Tienda XYZ' }}"
    [disabled]="!extraInfo.ubicacionTipo"
  >
  </div>

  <label class="pregunta">¿Se puede dejar paquetes en conserjería?</label>
  <div class="radio-group">
    <label><input type="radio" [(ngModel)]="extraInfo.conserjeria" value="sí" name="conserjeria2"> Sí</label>
    <label><input type="radio" [(ngModel)]="extraInfo.conserjeria" value="no" name="conserjeria2"> No</label>
  </div>
</div>

    <!-- division -->

          <div *ngIf="tipoLugar === 'casa' || tipoLugar === 'edificio'" class="grupo-form">
        <label class="pregunta">¿Está dentro de un barrio privado o condominio?</label>
        <div class="radio-group">
          <label><input type="radio" [(ngModel)]="extraInfo.barrio" value="sí" name="barrio"> Sí</label>
          <label><input type="radio" [(ngModel)]="extraInfo.barrio" value="no" name="barrio"> No</label>
        </div>

        <label class="pregunta">Nombre de la vivienda</label>
        <div class="nombre-casa-input">
          <input
            type="text"
            [(ngModel)]="extraInfo.nombre_casa"
            name="nombre_casa"
            placeholder="Ej: xxx"
            [disabled]="extraInfo.nombre_casa === 'Sin nombre'"
          >
          <label>
            <input
              type="checkbox"
              (change)="setNombreCasaSinNombre($event)"
            >
            Sin nombre
          </label>
        </div>

        <label class="pregunta">¿Se puede dejar paquetes en conserjería?</label>
        <div class="radio-group">
          <label><input type="radio" [(ngModel)]="extraInfo.conserjeria" value="sí" name="conserjeria"> Sí</label>
          <label><input type="radio" [(ngModel)]="extraInfo.conserjeria" value="no" name="conserjeria"> No</label>
        </div>
      </div>


          <div *ngIf="extraInfo.conserjeria === 'sí'">
          <label class="pregunta">¿En qué días y horarios está abierta la conserjería?</label>
      <div class="dias-botones">
        <button
          type="button"
          *ngFor="let d of dias"
          (click)="d.seleccionado = !d.seleccionado"
          [ngClass]="{ 'activo': d.seleccionado }"
        >
          {{ d.nombre }}
        </button>
      </div>


            <div class="horarios">
        <div class="bloque-hora">
          <label for="hora_apertura">Apertura</label>
          <select [(ngModel)]="extraInfo.hora_apertura" name="hora_apertura" id="hora_apertura">
            <option *ngFor="let hora of horas" [value]="hora">{{ hora }}</option>
          </select>
        </div>
        <div class="bloque-hora">
          <label for="hora_cierre">Cierre</label>
          <select [(ngModel)]="extraInfo.hora_cierre" name="hora_cierre" id="hora_cierre">
            <option *ngFor="let hora of horas" [value]="hora">{{ hora }}</option>
          </select>
        </div>
      </div>

          <div class="checkbox-linea">
            <input type="checkbox" id="abierto24" [(ngModel)]="extraInfo.abierto24" name="abierto24">
            <label for="abierto24">Abierto 24 horas</label>
          </div>
          
        
    </div>

    <button (click)="guardarExtra()">Guardar datos del lugar</button>
  </div>
</div>
