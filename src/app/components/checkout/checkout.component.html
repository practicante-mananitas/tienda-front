<div *ngIf="loading" class="loader-container">
  <div class="spinner"></div>
  <p>Preparando todo para tu compra</p>
</div>

<div *ngIf="!loading" class="checkout-wrapper">
  <div class="left">
    <h3>Dirección de entrega</h3>

    <div *ngIf="direcciones.length > 0; else sinDirecciones">
      <div *ngFor="let dir of direcciones">
        <label>
          <input type="radio" name="direccion" [value]="dir.id"
                 [checked]="direccionSeleccionada?.id === dir.id"
                 (change)="onDireccionChange(dir.id)">
          {{ dir.calle }}, {{ dir.colonia }}, {{ dir.municipio }}, {{ dir.estado }}
        </label>
      </div>
    </div>

    <ng-template #sinDirecciones>
      <p>No tienes direcciones registradas.</p>
      <button (click)="irANuevaDireccion()">Registrar dirección</button>
    </ng-template>
  </div>

  <div class="right">
    <h3>Resumen de compra</h3>
    <p>Subtotal: ${{ totalProductos }}</p>
    <p>Envío: ${{ costoEnvio }}</p>
    <hr>
    <p><strong>Total: ${{ totalProductos + costoEnvio }}</strong></p>
    <button (click)="confirmarCompra()">Confirmar compra</button>
  </div>
</div>
