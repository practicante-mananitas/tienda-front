<nav>
    <a routerLink="/login" *ngIf="!authService.isLoggedIn()">Login</a>
    <a routerLink="/register" *ngIf="!authService.isLoggedIn()">Register</a>
    <a routerLink="/profile" *ngIf="authService.isLoggedIn()">Perfil</a>
    <button (click)="logout()" *ngIf="authService.isLoggedIn()">Cerrar sesión</button>
    <a routerLink="/carrito" *ngIf="authService.isLoggedIn()" class="cart-link">
      <div class="cart-icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.5 10.5a1 1 0 0 0 1 .5H19a1 1 0 0 0 .98-.8l1.5-7.2H6" />
        </svg>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </div>
      
    </a>

  </nav>
