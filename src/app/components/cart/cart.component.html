<button class="back-btn" (click)="volver()">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
    <path d="M15 18l-6-6 6-6" />
  </svg>
  Volver
</button>

<h2 class="cart-title">Tu carrito</h2>

<div *ngIf="cartItems.length > 0; else vacio" class="cart-container">
  <div class="cart-items">
    <div class="cart-item" *ngFor="let item of cartItems">
      <img class="product-image" [src]="'http://127.0.0.1:8000/storage/' + item.product.image" alt="Imagen">
      <div class="product-info">
        <h3>{{ item.product.name }}</h3>
        <p class="price">$ {{ item.product.price }}</p>
        <div class="quantity">
          <span>Cantidad: {{ item.quantity }}</span>
        </div>
        <div class="subtotal">
          Subtotal: $ {{ item.product.price * item.quantity }}
        </div>
        <button class="remove-btn" (click)="removeItem(item.product.id)">Eliminar</button>
      </div>
    </div>
  </div>

  <div class="cart-summary">
    <h3>Resumen de compra</h3>
    <p>Productos: {{ cartItems.length }}</p>
    <p class="total">Total: $ {{ getTotal() }}</p>
    <button class="clear-btn" (click)="clearCart()">Vaciar carrito</button>
    <button class="checkout-btn" (click)="finalizeOrder()">Finalizar pedido</button>
  </div>
</div>

<ng-template #vacio>
  <p class="empty-msg">El carrito está vacío.</p>
</ng-template>
