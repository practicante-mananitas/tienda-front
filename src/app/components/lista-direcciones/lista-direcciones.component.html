<!-- Botón volver -->
<div class="back-btn-container">
  <button class="back-btn" (click)="volver()">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon">
      <path d="M15 18l-6-6 6-6" />
    </svg>
    Volver
  </button>
</div>

<div class="direccion-lista">
  <div *ngFor="let dir of direcciones" class="direccion-card">
    <div class="icono">🏠</div>
    <div class="contenido">
      <div class="calle"><strong>{{ dir.calle }} {{ dir.numero_interior }}</strong></div>
      <div class="cp">{{ dir.codigo_postal }} - {{ getNombreEstado(dir.estado) }} - {{ dir.municipio }}</div>
      <div class="info-extra">wiki hard - 7772199500</div>
      
      <!-- Links datos extra -->
      <a *ngIf="!dir.extra_info" [routerLink]="['/direccion-extra', dir.id]" class="link-agregar">
        Agregar datos y horarios del lugar
      </a>

      <a *ngIf="dir.extra_info" [routerLink]="['/direccion', dir.id]" class="link-editar">
        Editar datos del lugar
      </a>
    </div>

    <!-- Botón eliminar -->
    <button (click)="eliminarDireccion(dir.id)" class="btn-eliminar" title="Eliminar dirección">
      🗑️ Eliminar
    </button>
  </div>

  <div class="agregar-direccion">
    <a routerLink="/registrar-direccion">Agregar dirección</a>
  </div>
</div>
