<div>  
  <!-- Resto del panel como ya lo tienes -->
  <h2>🔥 Top Vendidos</h2>
  <select multiple [(ngModel)]="topVendidos">
    <option *ngFor="let p of productos" [value]="p.id">{{ p.name }}</option>
  </select>

  <h2>🎁 Recomendados</h2>
  <select multiple [(ngModel)]="recomendados">
    <option *ngFor="let p of productos" [value]="p.id">{{ p.name }}</option>
  </select>

  <h2>🏷️ Ofertas Relámpago</h2>
  <select multiple [(ngModel)]="ofertas">
    <option *ngFor="let p of productos" [value]="p.id">{{ p.name }}</option>
  </select>

  <button (click)="guardar()">Guardar</button>
</div>
