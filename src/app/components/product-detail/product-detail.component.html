<div *ngIf="product" class="detail-container">
    <img *ngIf="product.image" [src]="'http://127.0.0.1:8000/storage/' + product.image" alt="Producto">
    
    <div class="info">
      <h2>{{ product.name }}</h2>
      <p class="price">$ {{ product.price }}</p>
      <p class="desc">{{ product.description }}</p>
      <button (click)="agregarAlCarrito()">Agregar al carrito</button>
    </div>
  </div>
